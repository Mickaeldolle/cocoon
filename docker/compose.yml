services:
  caddy:
    build:
      context: ..
      dockerfile: docker/Caddy.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      # Keep the usual HTTP(S) ports available for other local projects.  A
      # production deployment explicitly sets these values to 80 and 443.
      - "${COCOON_HTTP_PORT:-8080}:80"
      - "${COCOON_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  api:
    build:
      context: ../apps/api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLM_CONNECTION_TIMEOUT: ${LLM_CONNECTION_TIMEOUT:-20}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-600}
      LLM_POOL_TIMEOUT: ${LLM_POOL_TIMEOUT:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_STREAMING: ${LLM_STREAMING:-true}
      LLM_HEALTHCHECK_ENABLED: ${LLM_HEALTHCHECK_ENABLED:-true}
      ASSISTANT_REQUESTS_PER_MINUTE: ${ASSISTANT_REQUESTS_PER_MINUTE:-30}
      STT_API_URL: ${STT_API_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      NOTIFICATION_WORKER_TOKEN: ${NOTIFICATION_WORKER_TOKEN:-}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AUDIT_TRUSTED_PROXY_CIDRS: ${AUDIT_TRUSTED_PROXY_CIDRS:-[]}
      MEMORY_EMBEDDINGS_ENABLED: ${MEMORY_EMBEDDINGS_ENABLED:-false}
      MEMORY_VECTOR_ENABLED: ${MEMORY_VECTOR_ENABLED:-false}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      MEMORY_EMBEDDING_REVISION: ${MEMORY_EMBEDDING_REVISION:-1}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-1024}
      MEMORY_EMBEDDING_TIMEOUT_SECONDS: ${MEMORY_EMBEDDING_TIMEOUT_SECONDS:-60}
      MEMORY_QUERY_TIMEOUT_SECONDS: ${MEMORY_QUERY_TIMEOUT_SECONDS:-3}
      MEMORY_MIN_SIMILARITY: ${MEMORY_MIN_SIMILARITY:-0.65}
      MEMORY_CONTEXT_TOKENS: ${MEMORY_CONTEXT_TOKENS:-1200}
      ASSISTANT_PROMPT_MAX_BYTES: ${ASSISTANT_PROMPT_MAX_BYTES:-24000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - private

  migrate:
    build:
      context: ../apps/api
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - private

  api-test:
    build:
      context: ../apps/api
      target: test
      additional_contexts:
        validation_docs: ../docs
    environment:
      DATABASE_URL: sqlite:///./unused-test.db
      JWT_SECRET: test-secret-that-is-long-enough-for-validation
    profiles: ["test"]
    networks:
      - private

  reminder-worker:
    build:
      context: ../apps/api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      EXPO_PUSH_ENDPOINT: ${EXPO_PUSH_ENDPOINT:-https://exp.host/--/api/v2/push/send}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.commands.run_reminder_worker"]
    networks:
      - private
      - egress

  capture-worker:
    build:
      context: ../apps/api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLM_CONNECTION_TIMEOUT: ${LLM_CONNECTION_TIMEOUT:-20}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-600}
      LLM_POOL_TIMEOUT: ${LLM_POOL_TIMEOUT:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_STREAMING: ${LLM_STREAMING:-true}
      LLM_HEALTHCHECK_ENABLED: ${LLM_HEALTHCHECK_ENABLED:-true}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.commands.run_capture_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private
      - egress

  # Enable only after preparing pgvector and qualifying the local embedding model.
  memory-worker:
    profiles: [memory]
    build:
      context: ../apps/api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      MEMORY_EMBEDDINGS_ENABLED: ${MEMORY_EMBEDDINGS_ENABLED:-false}
      MEMORY_VECTOR_ENABLED: ${MEMORY_VECTOR_ENABLED:-false}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      MEMORY_EMBEDDING_REVISION: ${MEMORY_EMBEDDING_REVISION:-1}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-1024}
      MEMORY_EMBEDDING_TIMEOUT_SECONDS: ${MEMORY_EMBEDDING_TIMEOUT_SECONDS:-60}
      MEMORY_WORKER_INTERVAL_SECONDS: ${MEMORY_WORKER_INTERVAL_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.commands.run_memory_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private
      - egress

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

networks:
  edge:
  egress:
  private:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
