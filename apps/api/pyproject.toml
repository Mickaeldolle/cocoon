[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoon-api"
version = "0.1.0"
description = "Cocoon private family application API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]

[tool.setuptools.packages.find]
include = ["app*"]
