name: Validate Cocoon MVP

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.17'

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --extra dev

      - name: Run API tests
        working-directory: apps/api
        run: uv run pytest -q

      - name: Run Ruff
        working-directory: apps/api
        run: uv run ruff check app migrations tests

      - name: Check migrations
        working-directory: apps/api
        run: uv run alembic heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f docker/compose.yml config --quiet

      - name: Validate Compose network policy
        shell: pwsh
        run: ./scripts/validate-compose-security.ps1
