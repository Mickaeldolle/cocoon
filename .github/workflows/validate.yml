name: Validate Cocoon MVP

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://cocoon_ci:ci-only-password@localhost:5432/cocoon_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://cocoon_ci:ci-only-password@localhost:5432/cocoon_ci
      MEMORY_TEST_DATABASE_URL: postgresql+psycopg://cocoon_ci:ci-only-password@localhost:5432/cocoon_ci
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cocoon_ci
          POSTGRES_USER: cocoon_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cocoon_ci -d cocoon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.17'

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --extra dev

      - name: Apply migrations to disposable PostgreSQL
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Check memory migration rollback on disposable PostgreSQL
        working-directory: apps/api
        run: |
          uv run alembic downgrade 20261006_39
          uv run alembic upgrade head
          uv run alembic current

      - name: Prepare pgvector storage twice on disposable PostgreSQL
        working-directory: apps/api
        run: |
          uv run python -m app.commands.run_memory_worker --setup-vector
          uv run python -m app.commands.run_memory_worker --setup-vector

      - name: Run API tests
        working-directory: apps/api
        env:
          MEMORY_PG_PLAN_OUTPUT: memory-plan.json
        run: uv run pytest -q

      - name: Save PostgreSQL memory plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-postgres-plans
          path: apps/api/memory-plan.json
          if-no-files-found: ignore

      - name: Run Ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check migrations
        working-directory: apps/api
        run: uv run alembic heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Lint mobile
        working-directory: apps/mobile
        run: npm run lint

      - name: Test mobile
        working-directory: apps/mobile
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f docker/compose.yml config --quiet

      - name: Validate Compose with Supabase PostgreSQL
        run: docker compose --env-file .env.example -f docker/compose.yml -f docker/compose.supabase.yml config --quiet

      - name: Validate Compose network policy
        shell: pwsh
        run: ./scripts/validate-compose-security.ps1
